name: 服务端镜像

# 打 tag（v1.2.3）触发正式发版；workflow_dispatch 只验证构建，产物打 dev-<sha> 标签。
#
# 两个架构各自在原生 runner 上单独构建并推送临时标签，最后用 imagetools 合并成
# 一个多架构 manifest。不用 QEMU 交叉模拟：Rust 的 release 编译在模拟下要一小时以上。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/youyou-server

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: 构建 linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          # 关闭 provenance：NAS 的容器管理界面（群晖 / 绿联）常无法解析带
          # attestation 的 manifest index，会让用户误判为镜像拉取失败。
          provenance: false
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          cache-to: type=gha,scope=server-image-${{ matrix.arch }},mode=max

  merge:
    name: 合并多架构 manifest
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并并打正式标签
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          TAGS=(-t "$IMAGE:$V")
          if [[ '${{ needs.version.outputs.release }}' == 'true' ]]; then
            MAJOR_MINOR=$(printf '%s' "$V" | cut -d. -f1,2)
            TAGS+=(-t "$IMAGE:$MAJOR_MINOR" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"
          docker buildx imagetools inspect "$IMAGE:$V"

  smoke:
    name: 拉起镜像并检查健康接口
    needs: [version, merge]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行一次空实例
        run: |
          set -euo pipefail
          VERSION='${{ needs.version.outputs.version }}'
          mkdir -p "$RUNNER_TEMP/youyou-server"
          docker pull --quiet "$IMAGE:$VERSION"
          # 按 deploy/docker-compose.yml 推荐的方式来：宿主目录 bind mount +
          # 以部署者 uid 运行。镜像内置的 uid 10001 对 bind mount 目录没有写权限，
          # 在真 Linux 上会以 "create data directory: Permission denied" 起不来，
          # 而 macOS 的 Docker 不强制 bind mount 权限，只有这里能验出来。
          docker run -d --name smoke \
            -u "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/youyou-server:/srv/youyou" \
            -p 8989:8989 "$IMAGE:$VERSION"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8989/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              echo
              break
            fi
            sleep 2
          done
          if ! grep -q '"status":"ok"' /tmp/health.json; then
            echo "::error::容器内健康接口未返回 ok，以下是容器日志"
            docker logs smoke
            docker inspect smoke --format '{{.State.ExitCode}} {{.State.Error}}' || true
            ls -ln "$RUNNER_TEMP/youyou-server"
            exit 1
          fi
          docker stop smoke
