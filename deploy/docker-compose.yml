# 柚柚相册服务端 · 拉取现成镜像部署（不需要 clone 源码）
#
#   mkdir -p ./youyou-server/data ./youyou-server/media
#   docker compose up -d
#
# 首次启动后取一次性初始化令牌创建管理员：
#   cat ./youyou-server/data/bootstrap/setup-token
# 然后打开 http://<本机地址>:8989/admin 完成初始化与设备配对。
#
# 镜像同时提供 linux/amd64 与 linux/arm64，可把 :latest 换成具体版本号。

services:
  youyou-server:
    image: ghcr.io/mqhe2007/youyou-server:latest
    # 镜像内置用户是 uid 10001，而 bind mount 的宿主目录属主是部署者本人，
    # 容器内那个 uid 对它没有写权限（Linux 上会直接起不来）。因此默认按部署者
    # uid 运行；群晖等设备上宿主用户 uid 不是 1000 时，显式指定 PUID/PGID：
    #   PUID=$(id -u) PGID=$(id -g) docker compose up -d
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${YOUYOU_SERVER_PORT:-8989}:${YOUYOU_SERVER_PORT:-8989}"
    environment:
      YOUYOU_SERVER_PORT: "${YOUYOU_SERVER_PORT:-8989}"
      YOUYOU_SERVER_DIR: /srv/youyou
      RUST_LOG: info
    volumes:
      # 运行时目录：data/ 存 SQLite 与备份，media/ 是默认媒体根。
      # 也可以把已有的照片目录额外挂进来，在管理页里指定为存储根。
      - "${YOUYOU_SERVER_DIR:-./youyou-server}:/srv/youyou"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:$${YOUYOU_SERVER_PORT}/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
